{{- $spec := .Get "spec" -}}

<div class="pinion-box">
    <div id="pinion-host"></div>
</div>

<script src="/pinion/pinion.js"></script>
<script>
  (function() {
    const host = document.getElementById("pinion-host");
    const shadow = host.attachShadow({ mode: "open" });

    // Inject styles and markup inside the shadow root
    shadow.innerHTML = `
      <link rel="stylesheet" href="/pinion/pinion.css">
      <style>
          #root h1.text-2xl {
              display: none;
          }

          div.rounded:has(input) {
              border-radius: 1.2rem;
              background-color: color-mix(in oklab,var(--hx-color-gray-500)10%,transparent);
              border: none;
              --tw-ease: var(--hx-ease-in);
              transition-timing-function: var(--hx-ease-in);
              transition-property: all;
              transition-duration: var(--tw-duration,var(--hx-default-transition-duration));
          }

          button:not(.flex-1):not(.p-2):not(.my-1) {
              display: none;
          }

          button.rounded {
              color: var(--hx-color-white);
              background-color: var(--hx-color-primary-600);
              border-radius: 3.40282e38px;
              --tw-ease: var(--hx-ease-in);
              transition-timing-function: var(--hx-ease-in);
              transition-property: all;
              transition-duration: var(--tw-duration,var(--hx-default-transition-duration));
          }

          button.rounded:hover {
              background-color: var(--hx-color-primary-700);
          }

          div:has(.text-right) {
            z-index: 1;
          }

          .border-2 {
            border-color: var(--hx-color-neutral-700);
          }

      </style>
      <div style="max-width: 1400px; margin: 0 auto;">
        <div id="root"></div>
      </div>
    `;

    // Mount Pinion into the isolated root element
    const rootEl = shadow.querySelector("#root");
    pinion.setup(rootEl, {
      source: "{{ $spec }}"
    });
  })();
</script>
