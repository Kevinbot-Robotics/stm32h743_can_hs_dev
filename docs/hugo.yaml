# Configuration for the STM32H743 CAN + USB-HS docs.
#
# This site works two ways:
#   1. Standalone   — run `hugo server` in this directory to preview/contribute
#                     the docs on their own (served under /dev/stm32h743-can-hs/).
#   2. As a module  — imported by kevinbot.net, which mounts this content into
#                     its own tree. The mounts below keep every absolute path
#                     (/pinion/..., /ibom/..., /dev/stm32h743-can-hs) identical
#                     in both builds, so nothing has to change when integrated.
baseURL: https://stm32h743-can-hs.docs.local/
title: STM32H743 CAN + USB-HS Dev Board
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content.root
      target: content
    - source: content
      target: content/dev/stm32h743-can-hs
    - source: static
      target: static
    - source: data
      target: data
    - source: layouts
      target: layouts

markup:
  goldmark:
    renderer:
      unsafe: true
